# Builds the Windows GUI on a real Windows runner (Flutter desktop builds
# need Windows; they cannot be cross-compiled from Linux) and attaches the
# zip to the existing release tag.
#
# Run it from the repo's Actions tab: "windows-release" -> Run workflow ->
# version (e.g. v1.1.1). The tag must already exist (create the release
# first); tbproxy.exe + openvpn.exe come from the tbproxy-cli Windows zip
# of the same version, or the newest CLI release that has one.
name: windows-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v1.1.1 (release must exist)'
        required: true
        default: 'v1.1.1'
      cli_version:
        description: 'tbproxy-cli tag for tbproxy.exe+openvpn.exe (empty = same version, else newest CLI release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch CLI release (tbproxy.exe + openvpn.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ inputs.version }}"
          $cliVer = "${{ inputs.cli_version }}"
          if ([string]::IsNullOrWhiteSpace($cliVer)) { $cliVer = $ver }
          $zipName = "tbproxy-$cliVer-windows-amd64.zip"
          $hasIt = gh release view $cliVer --repo FossilizedProgrammer/tbproxy-cli --json assets --jq '.assets[].name' 2>$null | Select-String -SimpleMatch $zipName -Quiet
          if (-not $hasIt) {
            $cliVer = gh release list --repo FossilizedProgrammer/tbproxy-cli --exclude-drafts --limit 10 --json tagName --jq '.[].tagName' |
              Where-Object { (gh release view $_ --repo FossilizedProgrammer/tbproxy-cli --json assets --jq '.assets[].name' 2>$null | Select-String -SimpleMatch "tbproxy-$($_)-windows-amd64.zip" -Quiet) } |
              Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($cliVer)) { throw "no tbproxy-cli release with a Windows zip found" }
            $zipName = "tbproxy-$cliVer-windows-amd64.zip"
          }
          Write-Host "Using tbproxy-cli $cliVer ($zipName)"
          echo "CLIVER=$cliVer" >> $env:GITHUB_ENV
          $url = "https://github.com/FossilizedProgrammer/tbproxy-cli/releases/download/$cliVer/$zipName"
          New-Item -ItemType Directory -Force -Path .vendor | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cli.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\cli.zip" -DestinationPath .vendor -Force
          Get-ChildItem .vendor

      - name: Ensure Windows scaffold
        run: |
          if (!(Test-Path windows)) { flutter create --platforms=windows . }

      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release

      - name: Bundle CLI + openvpn next to the app
        run: |
          $rel = "build\windows\x64\runner\Release"
          if (!(Test-Path "$rel\tbgui.exe")) { throw "tbgui.exe missing in $rel" }
          Copy-Item .vendor\tbproxy-windows-amd64.exe "$rel\tbproxy.exe" -Force
          Copy-Item .vendor\openvpn.exe "$rel\openvpn.exe" -Force
          Get-ChildItem $rel

      - name: Pack zip
        run: |
          $ver = "${{ inputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist\tbgui-$ver-windows-x86_64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zip

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ inputs.version }}"
          gh release upload $ver "dist\tbgui-$ver-windows-x86_64.zip" --clobber
